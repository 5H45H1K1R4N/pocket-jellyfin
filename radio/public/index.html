<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1017">
<title>Radio</title>
<style>
  :root{--bg:#0d1017;--panel:#161b26;--line:#252c3b;--ink:#eef0f5;--mute:#8b93a7;--amber:#ffb347;--red:#ff4d5e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;justify-content:center;color:var(--ink);
    background:radial-gradient(1000px 520px at 50% -8%,#222b3f,var(--bg));
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{width:100%;max-width:520px;padding:28px 18px 48px}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
  h1{font-size:20px;margin:0;letter-spacing:.04em;font-weight:650}
  .tag{font-size:12px;color:var(--mute)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.12em;
    padding:5px 11px;border-radius:99px;background:#1d2332;color:var(--mute)}
  .badge i{width:8px;height:8px;border-radius:50%;background:#46506a}
  body.live .badge{background:rgba(255,77,94,.14);color:var(--red)}
  body.live .badge i{background:var(--red);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.25}}
  .label{margin:20px 0 4px;font-size:12px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
  #title{font-size:22px;line-height:1.25;font-weight:600;min-height:56px;word-break:break-word}
  .eq{display:flex;gap:5px;align-items:flex-end;height:34px;margin:14px 0 4px}
  .eq span{width:7px;height:6px;border-radius:3px;background:var(--amber);opacity:.5}
  body.playing .eq span{opacity:1;animation:eq 1s ease-in-out infinite}
  .eq span:nth-child(2){animation-delay:.15s!important}.eq span:nth-child(3){animation-delay:.3s!important}
  .eq span:nth-child(4){animation-delay:.45s!important}.eq span:nth-child(5){animation-delay:.6s!important}
  @keyframes eq{0%,100%{height:6px}50%{height:32px}}
  button{font:inherit;cursor:pointer;border:0}
  #tune{width:100%;margin-top:22px;padding:16px;border-radius:14px;font-weight:700;font-size:17px;
    color:#1a1204;background:var(--amber)}
  #tune:active{transform:scale(.98)}
  .row{display:flex;align-items:center;gap:12px;margin-top:20px}
  .row input[type=range]{flex:1;accent-color:var(--amber)}
  .row small{color:var(--mute);min-width:84px;text-align:right}
  #status{margin-top:14px;font-size:13px;color:var(--mute);min-height:18px}
  ul{list-style:none;margin:6px 0 0;padding:0}
  li{padding:9px 0;border-top:1px solid var(--line);color:#c4c9d6;font-size:14px;word-break:break-word}
  li:first-child{border-top:0}
  .hide{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="station">Radio</h1>
    <span class="tag">home network only</span>
  </header>

  <section class="card">
    <span class="badge"><i></i><span id="badgeText">OFF AIR</span></span>
    <div class="label" id="nowLabel">Now playing</div>
    <div id="title">Press Tune in to listen</div>
    <div class="eq"><span></span><span></span><span></span><span></span><span></span></div>

    <button id="tune">Tune in</button>

    <div id="controls" class="row hide">
      <input id="vol" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="Volume">
      <small id="count"></small>
    </div>
    <div id="status"></div>
  </section>

  <section class="card" style="margin-top:16px">
    <div class="label" style="margin-top:0">Recently played</div>
    <ul id="history"><li style="color:var(--mute)">Nothing yet</li></ul>
  </section>
</main>
<audio id="player" preload="none"></audio>

<script>
const $ = (id) => document.getElementById(id);
let ctx, musicGain, voiceGain, ws, voiceT = 0, lastVoice = 0, duck = 1, baseVol = 0.9, live = null;

function setText(el, t) { el.textContent = t; }

function renderNow(now) {
  if (!now) { setText($('title'), 'Waiting for music…  (add MP3s to the music folder)'); return; }
  setText($('nowLabel'), now.kind === 'jingle' ? 'Station break' : 'Now playing');
  setText($('title'), now.title);
}
function renderHistory(h) {
  const ul = $('history');
  ul.textContent = '';
  if (!h || !h.length) { const li = document.createElement('li'); li.textContent = 'Nothing yet'; ul.appendChild(li); return; }
  for (const x of h) { const li = document.createElement('li'); li.textContent = x.title; ul.appendChild(li); }
}
function renderLive(l) {
  live = l;
  document.body.classList.toggle('live', !!l);
  setText($('badgeText'), l ? 'LIVE · ' + l.name.toUpperCase() : 'OFF AIR');
}
function renderCount(n) { setText($('count'), n === 1 ? '1 listener' : n + ' listeners'); }

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (e) => {
    if (typeof e.data !== 'string') return playVoice(e.data);
    const m = JSON.parse(e.data);
    if (m.type === 'hello') {
      setText($('station'), m.station); document.title = m.station;
      renderNow(m.now); renderHistory(m.history); renderLive(m.live); renderCount(m.listeners);
    } else if (m.type === 'now') { renderNow(m.now); renderHistory(m.history); }
    else if (m.type === 'live') renderLive(m.live);
    else if (m.type === 'stats') renderCount(m.listeners);
  };
  ws.onclose = () => setTimeout(connectWS, 2000);
}

function playVoice(buf) {
  if (!ctx || buf.byteLength % 2) return;
  const i16 = new Int16Array(buf);
  const f = new Float32Array(i16.length);
  let sum = 0;
  for (let i = 0; i < i16.length; i++) { const v = i16[i] / 32768; f[i] = v; sum += v * v; }
  if (Math.sqrt(sum / f.length) > 0.012) lastVoice = performance.now(); // only duck the music while someone is actually talking
  const b = ctx.createBuffer(1, f.length, 16000);
  b.copyToChannel(f, 0);
  const src = ctx.createBufferSource();
  src.buffer = b; src.connect(voiceGain);
  const now = ctx.currentTime;
  if (voiceT > now + 1.5) return;                 // too far behind real time, drop to stay live
  if (voiceT < now + 0.05) voiceT = now + 0.3;    // small jitter buffer
  src.start(voiceT);
  voiceT += b.duration;
}

function duckTick() {
  const target = performance.now() - lastVoice < 1200 ? 0.15 : 1;
  duck += (target - duck) * 0.2;
  if (musicGain) musicGain.gain.value = baseVol * duck;
}

function startStream() {
  const a = $('player');
  a.src = '/stream?' + Date.now();
  a.play().catch(() => {});
}

$('tune').onclick = () => {
  const a = $('player');
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  musicGain = ctx.createGain(); voiceGain = ctx.createGain();
  musicGain.gain.value = baseVol;
  ctx.createMediaElementSource(a).connect(musicGain);
  musicGain.connect(ctx.destination); voiceGain.connect(ctx.destination);

  a.addEventListener('playing', () => { document.body.classList.add('playing'); setText($('status'), ''); });
  a.addEventListener('waiting', () => setText($('status'), 'Buffering…'));
  a.addEventListener('pause', () => document.body.classList.remove('playing'));
  const retry = () => { setText($('status'), 'Reconnecting…'); setTimeout(startStream, 3000); };
  a.addEventListener('error', retry);
  a.addEventListener('ended', retry);

  startStream();
  setInterval(duckTick, 60);
  $('tune').classList.add('hide');
  $('controls').classList.remove('hide');
};

$('vol').oninput = (e) => { baseVol = Number(e.target.value); };

connectWS();
</script>
</body>
</html>
